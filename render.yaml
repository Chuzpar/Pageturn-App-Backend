services:
  - type: web
    name: pageturn-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 seed.py && exec gunicorn --bind 0.0.0.0:$PORT --workers 2 --access-logfile - run:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pageturn-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: PESAPAL_BASE_URL
        value: https://cybqa.pesapal.com/pesapalv3
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_IPN_ID
        sync: false
      - key: PESAPAL_CALLBACK_URL
        sync: false
      - key: PESAPAL_CURRENCY
        value: KES

databases:
  - name: pageturn-db
    plan: free